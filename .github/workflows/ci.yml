name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every currently supported LTS line, plus 26 which enters LTS on
        # 2026-10-28 and is what the toolchain floor (vitest) already allows.
        node: [22, 24, 26]
    name: lint-and-check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check (format + lint + imports)
        run: npm run check

      - name: Type check
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          slug: 7a6163/1min-relay-worker

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # What actually ships to the Worker has to be clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Dev tooling (wrangler pulls in esbuild, sharp, undici, ws) never
      # reaches the deployed Worker, and these advisories appear and get
      # patched on someone else's schedule. Report them, do not gate on them.
      - name: Audit dev dependencies
        run: npm audit
        continue-on-error: true
